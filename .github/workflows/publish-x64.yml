name: Publish x64 (manual)

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      # The fork runs on a newer SDK patch than the committed lock files, and
      # the publish script refuses to run on a dirty tree. Refresh the locks and
      # commit them locally (no push) so the tree is clean before publishing.
      - name: Refresh NuGet locks
        shell: pwsh
        run: |
          dotnet restore .\DeskBox.sln --force-evaluate -p:Platform=x64 -p:RuntimeIdentifier=win-x64
          dotnet restore .\src\DeskBox\DeskBox.csproj --force-evaluate -p:Platform=x64 -p:RuntimeIdentifier=win-x64 -p:PublishAot=true -p:DeskBoxRustNative=true -p:DeskBoxRustCrtLinkage=Static -p:JsonSerializerIsReflectionEnabledByDefault=false -p:IlcUseEnvironmentalTools=true -p:SelfContained=true -p:WindowsAppSDKSelfContained=true
          dotnet restore .\src\DeskBox.Updater\DeskBox.Updater.csproj --force-evaluate -p:Platform=x64 -p:RuntimeIdentifier=win-x64 -p:PublishAot=true -p:DeskBoxRustNative=true -p:DeskBoxRustCrtLinkage=Static -p:JsonSerializerIsReflectionEnabledByDefault=false -p:IlcUseEnvironmentalTools=true -p:SelfContained=true -p:WindowsAppSDKSelfContained=true
          git config user.email "prb9210@users.noreply.github.com"
          git config user.name "prb9210"
          git add -A
          git diff --cached --quiet; if ($LASTEXITCODE -ne 0) { git commit -m "ci: refresh lock files for this SDK" }
          git status --porcelain
      - name: Publish Native AOT retail
        shell: pwsh
        run: ./scripts/publish-aot-retail.ps1 -Platform x64
      - name: Upload publish folder
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deskbox-x64-publish
          path: |
            .artifacts/aot-retail/win-x64/publish/**
            .artifacts/aot-retail/win-x64/publish.log
            .artifacts/aot-retail/win-x64/summary.json
          if-no-files-found: warn
